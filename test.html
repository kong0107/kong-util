<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>test page</title>
    <script src="./dist/dom.js"></script>
    <script src="./dist/event.js"></script>
    <script src="./dist/image.js"></script>
    <script src="./dist/bootstrap.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
    <h1>test page</h1>
    <input type="file">
    <img>
    <script>
        // kongUtilDom.use();
        // kongUtilEvent.use();
        // kongUtilImage.use();
        kongUtilEvent.listen('[type=file]', 'change', async (event) => {
            const file = event.target.files[0];
            if(!file) return console.debug('no file');
            kongUtilDom.$('img').src = await kongUtilImage.resizeImage(file, {fit: 'scaleDown', height: 1000, returnType: 'dataURL'});
        });
        document.body.append(
            kongUtilDom.createInputComplex({type: 'file', style: 'display: none;'}, ['span', {style: 'border: 1px solid #444; cursor: pointer;'}, 'File Selector']),
            kongUtilDom.createSelectElement(
                {multiple: true, style: 'height: 5em'},
                {text1: 'value1', text2: 'value2', text3: 'value3'},
                ['value2', 'value3']
            ),
            kongUtilBootstrap.bsSwitch({}, 'switch'),
            kongUtilBootstrap.bsInputFloatingLabel({}, 'floating label #1', ['a1', 'a2', 'a3']),
            kongUtilBootstrap.bsSelectFloatingLabel({}, 'floating label #2', ['a1', 'a2', 'a3'], 'a3')
        );
    </script>
</body>
</html>
